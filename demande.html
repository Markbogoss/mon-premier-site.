<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faire une demande</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Faire une demande</h1>
    <nav>
      <a href="index.html">Accueil</a>
      <a href="contact.html">Contact</a>
      <a href="demande.html">Demande</a>
    </nav>
  </header>

  <main>
    <h2>Expliquez-nous votre besoin</h2>
    <p>Remplissez ce formulaire. Nous examinerons votre demande et vous répondrons ultérieurement.</p>

    <form action="https://formsubmit.co/VOTRE-EMAIL" method="POST">
      <label for="nom">Nom ou prénom</label>
      <input type="text" id="nom" name="nom" required>

      <label for="email">Adresse e-mail</label>
      <input type="email" id="email" name="email" required>

      <label for="sujet">Objet de la demande</label>
      <select id="sujet" name="sujet" required>
        <option value="">Choisissez une option</option>
        <option>Demande d'informations</option>
        <option>Demande de renseignements sur un service</option>
        <option>Autre demande</option>
      </select>

      <label for="message">Votre message</label>
      <textarea id="message" name="message" rows="6" required></textarea>

      <button type="submit">Envoyer ma demande</button>
    </form>
  </main>
</body>
</html>
